<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <script src="js/config.js?v=20261101-2"></script>
    <script src="js/site.js?v=20261101-2" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professores - Escola Antônio Austregésio</title>
    <link rel="stylesheet" href="css/style.css?v=20261102-2" />
</head>

<body>
    <header>
        <div class="menu-superior">
            <img src="imagens/transferir.jpg" alt="Logo do Ginásio Educacional Tecnológico" class="menu-img">
            <h1 class="menu-titulo">Antônio Austregésio</h1>
            <img src="imagens/fundoMenu.png" alt="Brasão e marca da Prefeitura do Rio de Janeiro" class="menu-img">
        </div>
        <nav aria-label="Menu principal">
            <button id="menu-btn" aria-label="Abrir menu" class="menu-btn">
                <span></span><span></span><span></span>
            </button>
            <ul id="menu-list">
                <li><a href="index.html">Início</a></li>
                <li><a href="quem-somos.html">Quem Somos</a></li>
                <li><a href="professores.html">Professores</a></li>
                <li><a href="avisos.html">Avisos</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="page-hero">
            <h2>Professores</h2>
            <p>Conheça a equipe que faz a escola acontecer.</p>
        </section>
        <section class="professores">
            <div class="prof-cards" id="prof-cards"></div>
        </section>
    </main>
    <footer>
        <p>&copy; <span data-current-year></span> Escola Antônio Austregésio</p>
    </footer>
    <script>
        // Menu hambúrguer responsivo
        const menuBtn = document.getElementById('menu-btn');
        const menuList = document.getElementById('menu-list');
        menuBtn.addEventListener('click', () => {
            menuList.classList.toggle('show');
        });
        document.addEventListener('click', function (e) {
            if (window.innerWidth <= 900 && !menuBtn.contains(e.target) && !menuList.contains(e.target)) {
                menuList.classList.remove('show');
            }
        });

        // Professores dinâmico
        fetch(`${API_URL}/professores`)
            .then(res => {
                if (!res.ok) throw new Error('Falha ao carregar professores.');
                return res.json();
            })
            .then(profs => {
                const cards = document.getElementById('prof-cards');
                cards.innerHTML = '';
                if (!profs.length) {
                    cards.innerHTML = '<div class="vazio">Nenhum professor cadastrado no momento.</div>';
                    return;
                }
                profs.forEach(prof => {
                    const card = document.createElement('div');
                    card.className = 'card-prof';

                    const fotoElem = document.createElement('img');
                    const fallbackFoto = 'imagens/fundoProfessor.png';
                    fotoElem.src = prof.foto || fallbackFoto;
                    fotoElem.alt = prof.foto ? `Foto de ${prof.nome || 'professor'}` : 'Foto genérica de professor';
                    fotoElem.loading = 'lazy';
                    fotoElem.onerror = () => {
                        fotoElem.onerror = null;
                        fotoElem.src = fallbackFoto;
                        fotoElem.alt = 'Foto genérica de professor';
                    };
                    fotoElem.className = 'foto-prof';
                    card.appendChild(fotoElem);

                    const nomeElem = document.createElement('strong');
                    nomeElem.textContent = prof.nome || '';
                    card.appendChild(nomeElem);

                    const disciplinaElem = document.createElement('span');
                    disciplinaElem.textContent = prof.disciplina || '';
                    card.appendChild(disciplinaElem);

                    cards.appendChild(card);
                });
            })
            .catch(() => {
                const cards = document.getElementById('prof-cards');
                cards.innerHTML = '<p>Não foi possível carregar os professores no momento. Tente novamente mais tarde.</p>';
            });
    </script>
</body>

</html>
