<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <script src="js/config.js?v=20261101-2"></script>
    <script src="js/site.js?v=20261101-2" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avisos - Escola Antônio Austregésio</title>
    <link rel="stylesheet" href="css/style.css?v=20261102-2" />
</head>

<body>
    <header>
        <div class="menu-superior">
            <img src="imagens/transferir.jpg" alt="Logo do Ginásio Educacional Tecnológico" class="menu-img">
            <h1 class="menu-titulo">Antônio Austregésio</h1>
            <img src="imagens/fundoMenu.png" alt="Brasão e marca da Prefeitura do Rio de Janeiro" class="menu-img">
        </div>
        <nav aria-label="Menu principal">
            <button id="menu-btn" aria-label="Abrir menu" class="menu-btn">
                <span></span><span></span><span></span>
            </button>
            <ul id="menu-list">
                <li><a href="index.html">Início</a></li>
                <li><a href="quem-somos.html">Quem Somos</a></li>
                <li><a href="professores.html">Professores</a></li>
                <li><a href="avisos.html">Avisos</a></li>
                <li><a href="galeria.html">Galeria</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="page-hero">
            <h2>Avisos</h2>
            <p>Fique por dentro dos comunicados e novidades da escola.</p>
        </section>
        <section class="avisos">
            <div class="aviso-cards" id="aviso-cards"></div>
        </section>
    </main>
    <footer>
        <p>&copy; <span data-current-year></span> Escola Antônio Austregésio</p>
    </footer>
    <script>
        // Menu hambúrguer responsivo
        const menuBtn = document.getElementById('menu-btn');
        const menuList = document.getElementById('menu-list');
        menuBtn.addEventListener('click', () => {
            menuList.classList.toggle('show');
        });
        document.addEventListener('click', function (e) {
            if (window.innerWidth <= 900 && !menuBtn.contains(e.target) && !menuList.contains(e.target)) {
                menuList.classList.remove('show');
            }
        });

        // Avisos dinâmico
        fetch(`${API_URL}/avisos`)
            .then(res => {
                if (!res.ok) throw new Error('Falha ao carregar avisos.');
                return res.json();
            })
            .then(avisos => {
                const cards = document.getElementById('aviso-cards');
                cards.innerHTML = '';
                if (!avisos.length) {
                    cards.innerHTML = '<div class="vazio">Nenhum aviso publicado no momento.</div>';
                    return;
                }
                avisos.slice().reverse().forEach(aviso => {
                    const card = document.createElement('div');
                    card.className = 'card-aviso';

                    const tituloElem = document.createElement('strong');
                    tituloElem.textContent = aviso.titulo;
                    card.appendChild(tituloElem);

                    const textoElem = document.createElement('span');
                    textoElem.textContent = aviso.texto;
                    card.appendChild(textoElem);

                    cards.appendChild(card);
                });
            })
            .catch(() => {
                const cards = document.getElementById('aviso-cards');
                cards.innerHTML = '<p>Não foi possível carregar os avisos no momento. Tente novamente mais tarde.</p>';
            });
    </script>
</body>

</html>
